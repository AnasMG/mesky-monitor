<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مقاعد MedSky — MJI ← MXP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1220;        /* night sky */
    --board:#131D31;     /* board panel */
    --line:#1E2A44;
    --amber:#F5B841;     /* FIDS amber */
    --green:#3DDC84;
    --red:#E4576A;
    --text:#E8EDF6;
    --dim:#7C89A3;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg);color:var(--text);
    font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;
    min-height:100vh;padding:20px 16px 40px;
    font-feature-settings:"tnum";
  }
  .wrap{max-width:520px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:2px solid var(--amber);padding-bottom:10px;margin-bottom:18px}
  header h1{font-size:15px;font-weight:500;letter-spacing:.06em;color:var(--amber)}
  header .route{font-size:15px;color:var(--dim)}
  /* hero: the answer */
  .answer{background:var(--board);border:1px solid var(--line);border-radius:10px;
    padding:22px 18px;text-align:center;margin-bottom:22px}
  .answer .label{font-size:12px;letter-spacing:.14em;color:var(--dim);margin-bottom:8px}
  .answer .value{font-size:26px;font-weight:700;line-height:1.3}
  .answer .value.ok{color:var(--green)}
  .answer .value.none{color:var(--red)}
  .answer .sub{font-size:13px;color:var(--dim);margin-top:8px}
  /* board rows */
  .board{border-top:1px solid var(--line)}
  .row{display:flex;align-items:center;gap:12px;padding:14px 4px;
    border-bottom:1px solid var(--line)}
  .row .when{flex:1;min-width:0}
  .row .date{font-size:16px;font-weight:500}
  .row .meta{font-size:12px;color:var(--dim);margin-top:2px}
  .row .seats{text-align:left;direction:ltr;font-size:12px;color:var(--dim);white-space:nowrap}
  .badge{font-size:13px;font-weight:700;padding:5px 12px;border-radius:6px;white-space:nowrap}
  .badge.ok{color:#06110A;background:var(--green)}
  .badge.none{color:var(--red);background:transparent;border:1px solid var(--red);opacity:.85}
  footer{margin-top:22px;font-size:12px;color:var(--dim);text-align:center;line-height:1.9}
  footer .stale{color:var(--amber)}
  .state{padding:40px 10px;text-align:center;color:var(--dim);font-size:14px;line-height:1.9}
  @media (prefers-reduced-motion:no-preference){
    .row{animation:in .25s ease both}
    @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>لوحة مقاعد MEDSKY</h1>
    <div class="route" id="route">MJI ← MXP</div>
  </header>
  <div id="app"><div class="state">جاري تحميل البيانات…</div></div>
  <footer id="foot"></footer>
</div>
<script>
const TZ="Africa/Tripoli";
const app=document.getElementById("app"), foot=document.getElementById("foot");

function fmtDep(s){
  // "2026-09-11 09:00" -> weekday + date + time in Arabic
  const d=new Date(s.replace(" ","T"));
  if(isNaN(d)) return s;
  return d.toLocaleDateString("ar-LY",{weekday:"long",day:"numeric",month:"long"})
        +" — "+d.toLocaleTimeString("ar-LY",{hour:"2-digit",minute:"2-digit"});
}
function render(data){
  const flights=data.flights||[];
  const avail=flights.filter(f=>f.seats>0);
  let html="";

  // hero: the answer first
  if(avail.length){
    const first=avail[0];
    html+=`<div class="answer"><div class="label">أقرب مقعد متاح</div>
      <div class="value ok">${fmtDep(first.departure)}</div>
      <div class="sub">${first.seats} مقعد — رحلة ${first.flight} · احجز من booking.medsky.aero</div></div>`;
  }else{
    html+=`<div class="answer"><div class="label">الوضع الحالي</div>
      <div class="value none">لا مقاعد متاحة</div>
      <div class="sub">كل الرحلات في النافذة الحالية مكتملة — التنبيه بيجيك أول ما يتغير الوضع</div></div>`;
  }

  // full board
  html+=`<div class="board">`+flights.map(f=>{
    const ok=f.seats>0;
    const cls=Object.entries(f.classes||{}).map(([k,v])=>k+":"+v).join("  ");
    return `<div class="row">
      <div class="when"><div class="date">${fmtDep(f.departure)}</div>
      <div class="meta">رحلة ${f.flight}</div></div>
      <div class="seats">${cls}</div>
      <div class="badge ${ok?"ok":"none"}">${ok?f.seats+" مقعد":"مكتملة"}</div>
    </div>`;
  }).join("")+`</div>`;

  app.innerHTML=html;
  document.getElementById("route").textContent=(data.from||"MJI")+" ← "+(data.to||"MXP");

  const upd=new Date(data.updated_utc);
  const ageMin=Math.round((Date.now()-upd.getTime())/60000);
  let t="آخر فحص: "+upd.toLocaleString("ar-LY",{timeZone:TZ,hour:"2-digit",minute:"2-digit",day:"numeric",month:"numeric"})
       +" (بتوقيت ليبيا) · يتجدد كل نص ساعة تقريباً";
  if(ageMin>120) t+=`<br><span class="stale">⚠ البيانات عمرها ${Math.round(ageMin/60)} ساعة — تأكد إن المراقب شغال في GitHub Actions</span>`;
  foot.innerHTML=t;
}
async function load(){
  try{
    const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw 0;
    render(await r.json());
  }catch(e){
    app.innerHTML=`<div class="state">ما فيش بيانات بعد.<br>
      شغّل المراقب مرة وحدة من GitHub Actions (زر Run workflow)<br>وارجع حدّث الصفحة.</div>`;
    foot.textContent="";
  }
}
load();
setInterval(load, 5*60*1000); // refresh every 5 minutes while open
</script>
</body>
</html>
