<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070B14">
<title>مقاعد MedSky — MJI ← MXP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;600;800&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#070B14; --bg1:#0D1526;
    --panel:rgba(255,255,255,.035);
    --panel-line:rgba(216,178,92,.22);
    --hairline:rgba(139,150,173,.16);
    --gold:#D8B25C; --gold-soft:#E7C878;
    --green:#34D399; --red:#F87171;
    --text:#F2F5FB; --dim:#8B96AD;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100vh;color:var(--text);
    background:radial-gradient(120% 90% at 50% -10%, var(--bg1) 0%, var(--bg0) 60%);
    font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;
    font-feature-settings:"tnum";
    padding:26px 18px 48px;
  }
  .wrap{max-width:500px;margin:0 auto}

  /* masthead */
  .mast{text-align:center;margin-bottom:26px}
  .mast .brand{
    font-family:"Alexandria",sans-serif;font-weight:800;font-size:20px;
    letter-spacing:.04em;color:var(--gold-soft);
  }
  .mast .tag{font-size:11.5px;color:var(--dim);letter-spacing:.28em;margin-top:6px}
  .mast::after{
    content:"";display:block;width:56px;height:2px;margin:16px auto 0;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }

  /* boarding-pass hero */
  .pass{
    position:relative;border-radius:16px;overflow:hidden;
    background:linear-gradient(160deg,rgba(216,178,92,.10),rgba(216,178,92,.02) 45%),var(--panel);
    border:1px solid var(--panel-line);
    box-shadow:0 24px 60px -30px rgba(0,0,0,.8);
    margin-bottom:30px;
  }
  .pass .route{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 22px 16px;direction:ltr;
  }
  .pass .code{font-family:"Alexandria",sans-serif;font-weight:800;font-size:30px;letter-spacing:.02em}
  .pass .city{font-size:11px;color:var(--dim);margin-top:2px;letter-spacing:.08em}
  .pass .path{flex:1;position:relative;height:1px;margin:0 16px;
    background-image:linear-gradient(90deg,var(--gold) 40%,transparent 0);
    background-size:8px 1px;opacity:.65}
  .pass .path::after{
    content:"✈";position:absolute;top:-11px;left:50%;transform:translateX(-50%);
    font-size:14px;color:var(--gold-soft);
  }
  .perf{position:relative;height:0;border-top:1.5px dashed rgba(139,150,173,.35);margin:0 14px}
  .perf::before,.perf::after{
    content:"";position:absolute;top:-9px;width:18px;height:18px;border-radius:50%;
    background:var(--bg0);border:1px solid var(--panel-line);
  }
  .perf::before{right:-24px}
  .perf::after{left:-24px}
  .pass .body{padding:18px 22px 22px;text-align:center}
  .pass .label{font-size:11px;letter-spacing:.3em;color:var(--dim);margin-bottom:10px}
  .pass .value{font-family:"Alexandria",sans-serif;font-weight:600;font-size:22px;line-height:1.45}
  .pass .value.ok{color:var(--green)}
  .pass .value.none{color:var(--red);font-weight:400}
  .pass .sub{font-size:13px;color:var(--dim);margin-top:10px;line-height:1.8}
  .pass .sub b{color:var(--gold-soft);font-weight:500}

  /* schedule */
  .sched-title{
    display:flex;align-items:center;gap:12px;
    font-size:11.5px;letter-spacing:.26em;color:var(--dim);margin-bottom:6px;
  }
  .sched-title::after{content:"";flex:1;height:1px;background:var(--hairline)}
  .row{
    display:flex;align-items:center;gap:14px;
    padding:16px 4px;border-bottom:1px solid var(--hairline);
  }
  .row:last-child{border-bottom:none}
  .row .when{flex:1;min-width:0}
  .row .date{font-family:"Alexandria",sans-serif;font-weight:400;font-size:15.5px}
  .row .meta{font-size:11.5px;color:var(--dim);margin-top:4px;letter-spacing:.04em}
  .row .cls{direction:ltr;font-size:11px;color:var(--dim);white-space:nowrap;letter-spacing:.05em}
  .pill{
    font-family:"Alexandria",sans-serif;font-size:12.5px;font-weight:600;
    padding:6px 14px;border-radius:999px;white-space:nowrap;
  }
  .pill.ok{color:#06110A;background:linear-gradient(135deg,var(--green),#6EE7B7)}
  .pill.none{color:var(--dim);border:1px solid var(--hairline);font-weight:300}

  footer{margin-top:34px;font-size:11.5px;color:var(--dim);text-align:center;line-height:2.1;letter-spacing:.03em}
  footer .stale{color:var(--gold)}

  /* direction tabs */
  .tabs{display:flex;gap:8px;margin-bottom:18px}
  .tab{
    flex:1;text-align:center;padding:11px 8px;border-radius:10px;cursor:pointer;
    font-family:"Alexandria",sans-serif;font-size:13.5px;font-weight:400;
    color:var(--dim);background:var(--panel);border:1px solid var(--hairline);
    transition:.18s;user-select:none;
  }
  .tab .sub{display:block;font-size:10.5px;margin-top:3px;opacity:.7;font-family:"IBM Plex Sans Arabic"}
  .tab.on{color:var(--gold-soft);border-color:var(--panel-line);
    background:linear-gradient(160deg,rgba(216,178,92,.12),rgba(216,178,92,.03))}
  .tab.on .sub{opacity:.9}

  /* movement history */
  .hnote{font-size:11px;color:var(--dim);margin-bottom:10px;letter-spacing:.02em;opacity:.8}
  .hrow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--hairline)}
  .hrow:last-child{border-bottom:none}
  .hd{flex:1;min-width:0}
  .hflight{font-family:"Alexandria",sans-serif;font-size:14px}
  .hverb{font-size:11px;color:var(--dim);margin-top:3px;direction:ltr;text-align:right;letter-spacing:.03em}
  .hwhen{font-size:11px;color:var(--dim);white-space:nowrap;direction:ltr}
  .hdelta{font-family:"Alexandria",sans-serif;font-weight:600;font-size:15px;min-width:38px;text-align:center;direction:ltr}
  .hdelta.up{color:var(--green)}
  .hdelta.down{color:var(--red)}
  .state{padding:48px 12px;text-align:center;color:var(--dim);font-size:14px;line-height:2}

  @media (prefers-reduced-motion:no-preference){
    .pass{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
    .row{animation:rise .4s cubic-bezier(.2,.7,.2,1) both}
    .row:nth-child(2){animation-delay:.05s}.row:nth-child(3){animation-delay:.1s}
    .row:nth-child(4){animation-delay:.15s}.row:nth-child(5){animation-delay:.2s}
    .row:nth-child(6){animation-delay:.25s}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="mast">
    <div class="brand">لوحة مقاعد MEDSKY</div>
    <div class="tag" id="route">MJI — MXP</div>
  </div>
  <div id="app"><div class="state">جاري تحميل البيانات…</div></div>
  <footer id="foot"></footer>
</div>
<script>
const TZ="Africa/Tripoli";
const app=document.getElementById("app"), foot=document.getElementById("foot");
const CITY={MJI:"معيتيقة · طرابلس",MXP:"مالبينسا · ميلانو"};
const API="https://portal.medsky.aero/api/FlightBooking/GetAvailability";
// Directions: outbound alerts, return is display-only (matches monitor.py)
const LEGS=[
  {from:"MJI", to:"MXP", label:"ذهاب"},
  {from:"MXP", to:"MJI", label:"عودة"},
];
let DIRS=[];      // [{from,to,flights,live}]
let ACTIVE=0;     // which tab is shown

function fmtDep(s){
  const d=new Date(s.replace(" ","T"));
  if(isNaN(d)) return s;
  return d.toLocaleDateString("ar-LY",{weekday:"long",day:"numeric",month:"long"})
        +" — "+d.toLocaleTimeString("ar-LY",{hour:"2-digit",minute:"2-digit"});
}
function fmtShort(dep){
  const d=new Date(dep.replace(" ","T"));
  if(isNaN(d)) return dep;
  return d.toLocaleDateString("ar-LY",{day:"numeric",month:"short"});
}
function fmtWhen(ts){
  const d=new Date(ts);
  if(isNaN(d)) return ts;
  return d.toLocaleString("ar-LY",{timeZone:TZ,day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"});
}

function renderTabs(){
  return `<div class="tabs">`+DIRS.map((d,i)=>
    `<div class="tab ${i===ACTIVE?"on":""}" onclick="pick(${i})">${LEGS[i].label}
       <span class="sub">${d.from} → ${d.to}</span></div>`).join("")+`</div>`;
}
function renderDir(d){
  const flights=d.flights||[];
  const avail=flights.filter(f=>f.seats>0);
  let hero;
  if(avail.length){
    const f=avail[0];
    hero=`<div class="label">أقرب مقعد متاح</div>
      <div class="value ok">${fmtDep(f.departure)}</div>
      <div class="sub"><b>${f.seats} مقعد</b> · رحلة ${f.flight} · احجز من booking.medsky.aero</div>`;
  }else{
    hero=`<div class="label">الوضع الحالي</div>
      <div class="value none">لا مقاعد متاحة</div>
      <div class="sub">كل الرحلات في النافذة الحالية مكتملة</div>`;
  }
  const rows=flights.map(f=>{
    const ok=f.seats>0;
    const cls=Object.entries(f.classes||{}).map(([k,v])=>k+":"+v).join("  ");
    return `<div class="row">
      <div class="when"><div class="date">${fmtDep(f.departure)}</div>
      <div class="meta">رحلة ${f.flight}</div></div>
      <div class="cls">${cls}</div>
      <div class="pill ${ok?"ok":"none"}">${ok?f.seats+" مقعد":"مكتملة"}</div>
    </div>`;
  }).join("") || `<div class="state">ما فيش رحلات في النافذة الحالية.</div>`;

  return `<div class="pass">
      <div class="route">
        <div><div class="code">${d.from}</div><div class="city">${CITY[d.from]||""}</div></div>
        <div class="path"></div>
        <div style="text-align:right"><div class="code">${d.to}</div><div class="city">${CITY[d.to]||""}</div></div>
      </div>
      <div class="perf"></div>
      <div class="body">${hero}</div>
    </div>
    <div class="sched-title">جدول الرحلات</div>
    <div class="board">${rows}</div>`;
}
function paint(){
  if(!DIRS.length) return;
  const d=DIRS[ACTIVE];
  app.innerHTML=renderTabs()+renderDir(d)+`<div id="hist"></div>`;
  document.getElementById("route").textContent=d.from+" — "+d.to;
  loadHistory(d);

  if(DIRS.some(x=>x.live)){
    foot.innerHTML="⚡ بيانات مباشرة من MedSky — اتجابت لحظة فتح الصفحة"
      +"<br>التنبيهات التلقائية على الذهاب فقط · العودة للعرض";
  }else{
    const upd=new Date(DIRS._updated);
    const ageMin=Math.round((Date.now()-upd.getTime())/60000);
    let t="آخر فحص: "+upd.toLocaleString("ar-LY",{timeZone:TZ,hour:"2-digit",minute:"2-digit",day:"numeric",month:"numeric"})
         +" بتوقيت ليبيا · يتجدد تلقائياً كل نص ساعة";
    if(ageMin>120) t+=`<br><span class="stale">⚠ البيانات عمرها ${Math.round(ageMin/60)} ساعة — تأكد إن المراقب شغال في GitHub Actions</span>`;
    foot.innerHTML=t;
  }
}
function pick(i){ ACTIVE=i; paint(); }

async function loadHistory(d){
  const box=document.getElementById("hist");
  if(!box) return;
  let log=[];
  try{
    const r=await fetch("history.json?t="+Date.now(),{cache:"no-store"});
    if(r.ok) log=await r.json();
  }catch(e){}
  const dir=d.from+d.to;
  // show only movements for the active direction (older logs have no dir -> show on outbound)
  log=log.filter(m=> m.dir? m.dir===dir : (ACTIVE===0));
  if(!log.length){ box.innerHTML=""; return; }
  log=log.slice().reverse().slice(0,40);

  const rows=log.map(m=>{
    const up=m.delta>0;
    const sign=up?"+"+m.delta:String(m.delta);
    const verb=up?"رجعت مقاعد":"اتحجزت مقاعد";
    return `<div class="hrow">
      <div class="hd">
        <div class="hflight">رحلة ${fmtShort(m.departure)} · ${m.cls}</div>
        <div class="hverb">${verb} · ${m.from}→${m.to}</div>
      </div>
      <div class="hwhen">${fmtWhen(m.ts)}</div>
      <div class="hdelta ${up?"up":"down"}">${sign}</div>
    </div>`;
  }).join("");

  box.innerHTML=`<div class="sched-title" style="margin-top:30px">الحركة الأخيرة</div>
    <div class="hnote">تغيّرات هذا الاتجاه، من أحدث فحص للأقدم · بتوقيت ليبيا</div>
    <div class="hlist">${rows}</div>`;
}

/* Live fetch straight from the MedSky API for one direction */
async function fetchLiveDir(from,to){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(), 7000);
  try{
    const today=new Date().toISOString().slice(0,10);
    const r=await fetch(API,{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({office:1, date:today, from, to}),
      signal:ctrl.signal});
    if(!r.ok) throw 0;
    const raw=await r.json();
    const flights=[];
    for(const j of (raw.journeys||[])){
      for(const leg of (j.legs||[])){
        const classes={}; let seats=0;
        for(const c of (leg.availability?.classes||[])){
          const n=Number(c.availability)||0; classes[c.id]=n; seats+=n;
        }
        flights.push({flight:leg.flightNumber||"?", departure:leg.departureDateTime||"", seats, classes});
      }
    }
    flights.sort((a,b)=>a.departure.localeCompare(b.departure));
    return {from,to,flights,live:true};
  }finally{ clearTimeout(timer); }
}
async function fetchCached(){
  const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});
  if(!r.ok) throw 0;
  return await r.json();
}
async function load(){
  // try live for both directions in parallel
  const results=await Promise.allSettled(LEGS.map(l=>fetchLiveDir(l.from,l.to)));
  const live=results.map((r,i)=> r.status==="fulfilled" && r.value.flights.length ? r.value : null);
  if(live.every(Boolean)){
    DIRS=live; paint(); return;
  }
  // fallback: cached data.json (new two-direction format, or legacy single)
  try{
    const data=await fetchCached();
    if(data.directions){ DIRS=data.directions.map(d=>({...d,live:false})); }
    else { DIRS=[{from:data.from||"MJI",to:data.to||"MXP",flights:data.flights||[],live:false}]; }
    DIRS._updated=data.updated_utc;
    // keep any live directions we did get
    live.forEach((v,i)=>{ if(v) DIRS[i]=v; });
    paint();
  }catch(e){
    app.innerHTML=`<div class="state">ما فيش بيانات بعد.<br>شغّل المراقب مرة وحدة من GitHub Actions وارجع حدّث الصفحة.</div>`;
    foot.textContent="";
  }
}
load();
setInterval(load, 5*60*1000);
</script>
</body>
</html>
